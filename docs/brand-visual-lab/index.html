<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HANA Brand Visual Lab</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#282824;background:#f8f7f4}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:30px 18px}h1{font:400 clamp(30px,5vw,54px) Georgia,serif}h2{font-size:17px;font-weight:500}small,.hint{color:#777}.layout{display:grid;grid-template-columns:310px 1fr;gap:18px}.panel{border:1px solid #ddd9d2;background:white;padding:22px;margin:12px 0;border-radius:6px}button,input,select{font:inherit;border:1px solid #ccc;padding:9px;background:white;border-radius:3px;max-width:100%}button{cursor:pointer;margin:3px}button.active{background:#333;color:white}label{display:block;margin:14px 0}input[type=text]{width:100%;margin-top:5px}.stage{display:flex;align-items:center;justify-content:center;min-height:320px;padding:22px;transition:.2s}.identity{width:80%;text-align:center}.identity.left{text-align:left}.identity.frame{padding:30px;border:1px solid currentColor}.name{font-size:clamp(36px,7vw,76px);overflow-wrap:anywhere}.tagline{letter-spacing:.18em;font-size:12px;margin-top:16px}.mood{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}.mood>div{min-height:105px;display:grid;place-items:center;padding:14px;text-align:center;overflow-wrap:anywhere}.mood>div:first-child{grid-row:span 2}.palette button{padding:6px}.palette i{display:inline-block;width:24px;height:24px}.previewgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.mock{min-height:110px;display:grid;place-items:center;border:1px solid #ddd;letter-spacing:.1em}.actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:780px){.layout{grid-template-columns:1fr}}</style></head><body><small>HANA INTERACTIVE STUDIO / 02</small><h1>品牌視覺風格實驗室</h1><p class="hint">切換品牌調性、色彩、字體與構圖，探索不同視覺識別方向，並生成可下載的 Moodboard。</p><div class="layout"><aside class="panel"><h2>品牌基本資料</h2><label>名稱<input type="text" id="name" maxlength="48" value="HANA"></label><label>標語<input type="text" id="tag" maxlength="80" value="SCENT · ART · IDENTITY"></label><h2>品牌風格</h2><div id="styles"></div><h2>配色</h2><div id="palettes" class="palette"></div><p id="colors" class="hint"></p><h2>字體</h2><select id="font"><option value="Georgia,serif">經典襯線 Serif</option><option value="Arial,sans-serif">現代無襯線 Sans</option><option value="'Times New Roman',serif">復古高對比</option><option value="'Courier New',monospace">理性等寬 Mono</option></select><h2>構圖</h2><div id="layouts"></div><h2>輸出</h2><div class="actions"><button id="download">下載 Moodboard</button><button id="svg">下載 SVG</button><button id="copy">複製規格</button></div><p id="status" class="hint" aria-live="polite"></p></aside><section><div class="panel"><h2>Identity Preview</h2><div id="stage" class="stage"><div id="identity" class="identity"><div class="name" id="previewName"></div><div class="tagline" id="previewTag"></div></div></div><div class="previewgrid"><div class="mock" id="pack"></div><div class="mock" id="card"></div></div></div><div class="panel"><h2>Moodboard</h2><p class="hint" id="caption"></p><div id="mood" class="mood"></div><small>本版以色彩及編排建立概念情緒板，不使用未經查證的照片。</small></div></section></div><script>const themes=[['極簡','克制、留白、精確',0,0,0],['復古','工藝、懷舊、敘事',1,2,2],['藝術','實驗、編輯、感性',2,0,1],['現代街頭','醒目、節奏、都市',3,1,3]];const palettes=[['#F4F1E9','#292C29','#BAB4A7'],['#F0E7DC','#793F38','#C7A58B'],['#E7E9E1','#4E6459','#BBC3BA'],['#EEE9DF','#283D53','#BFA781'],['#F2EFF1','#544652','#BBAAB6']];const fontList=['Georgia,serif','Arial,sans-serif',"'Times New Roman',serif","'Courier New',monospace"];const layoutList=[['center','置中'],['left','編輯式'],['frame','框線式'],['stack','堆疊式']];let state={theme:0,palette:0,font:0,layout:0};const el=x=>document.getElementById(x);function chooseStyle(i){state.theme=i;state.palette=themes[i][2];state.font=themes[i][3];state.layout=themes[i][4];el('font').selectedIndex=state.font;render()}function escapeText(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const p=palettes[state.palette],n=el('name').value||'BRAND',t=el('tag').value,f=fontList[state.font];el('styles').innerHTML=themes.map((s,i)=>'<button class="'+(state.theme===i?'active':'')+'" onclick="chooseStyle('+i+')">'+s[0]+'</button>').join('');el('palettes').innerHTML=palettes.map((a,i)=>'<button aria-label="色票 '+(i+1)+'" class="'+(state.palette===i?'active':'')+'" onclick="state.palette='+i+';render()">'+a.map(c=>'<i style="background:'+c+'"></i>').join('')+'</button>').join('');el('colors').textContent=p.join(' / ');el('layouts').innerHTML=layoutList.map((a,i)=>'<button class="'+(state.layout===i?'active':'')+'" onclick="state.layout='+i+';render()">'+a[1]+'</button>').join('');el('stage').style.cssText='background:'+p[0]+';color:'+p[1];el('identity').className='identity '+layoutList[state.layout][0];el('previewName').textContent=n;el('previewTag').textContent=t;el('previewName').style.fontFamily=f;el('previewTag').style.fontFamily=f;el('previewName').style.letterSpacing=state.layout===3?'-.045em':'.08em';for(const id of ['pack','card']){el(id).style.cssText='background:'+p[0]+';color:'+p[1]+';font-family:'+f;el(id).textContent=id==='pack'?n+' / EAU DE PARFUM':n+' / '+t}el('caption').textContent=themes[state.theme][0]+' — '+themes[state.theme][1];el('mood').innerHTML='<div style="background:'+p[1]+';color:'+p[0]+';font:30px '+f+'">'+escapeText(n)+'</div><div style="background:'+p[0]+';color:'+p[1]+'">PRIMARY<br>'+p[0]+'</div><div style="background:'+p[2]+';color:'+p[1]+'">ACCENT<br>'+p[2]+'</div><div style="background:'+p[0]+';color:'+p[1]+';font:18px '+f+'">Aa Bb Cc</div><div style="background:'+p[1]+';color:'+p[0]+'">'+themes[state.theme][1]+'</div>'}function spec(){return 'HANA Brand Visual Lab\n品牌：'+el('name').value+'\n標語：'+el('tag').value+'\n風格：'+themes[state.theme][0]+'\n顏色：'+palettes[state.palette].join(', ')+'\n字體：'+fontList[state.font]+'\n構圖：'+layoutList[state.layout][1]}function save(file,name,type){let url=URL.createObjectURL(new Blob([file],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);el('status').textContent='下載檔案已產生'}el('download').onclick=()=>save('<!doctype html><meta charset="utf-8"><h1>Brand Moodboard</h1><pre>'+escapeText(spec())+'</pre><style>body{font-family:Georgia,serif;margin:40px}.mood{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mood div{padding:60px 12px;text-align:center}</style><div class="mood">'+el('mood').innerHTML+'</div>','hana-brand-moodboard.html','text/html');el('svg').onclick=()=>{let p=palettes[state.palette];save('<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="'+p[0]+'"/><text x="600" y="320" font-size="78" font-family="Georgia" text-anchor="middle" fill="'+p[1]+'">'+escapeText(el('name').value)+'</text><text x="600" y="380" font-size="21" text-anchor="middle" fill="'+p[1]+'">'+escapeText(el('tag').value)+'</text></svg>','hana-brand-identity.svg','image/svg+xml')};el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(spec());el('status').textContent='規格已複製'}catch{el('status').textContent='複製失敗，請下載 Moodboard'}};el('font').onchange=e=>{state.font=e.target.selectedIndex;render()};el('name').oninput=render;el('tag').oninput=render;render();</script></body></html>
