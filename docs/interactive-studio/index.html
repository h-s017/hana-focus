<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HANA Interactive Studio</title><style>:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#292a28;background:#f7f6f3}*{box-sizing:border-box}body{max-width:980px;margin:auto;padding:28px 18px 70px}h1,h2{font-family:Georgia,serif;font-weight:500}h1{font-size:clamp(30px,6vw,52px);margin:6px 0}h2{font-size:25px}small,.muted{color:#777}nav,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit;border:1px solid #ccc;background:white;border-radius:7px;padding:9px}button{cursor:pointer}button.active{background:#292a28;color:white}button:hover{border-color:#444}.panel{background:#fff;border:1px solid #e3e1dc;border-radius:14px;padding:20px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tile{border:1px solid #e3e1dc;padding:18px;border-radius:12px;cursor:pointer}.tile:hover{background:#f7f6f3}.tile strong{display:block;font-size:18px}.tile p{font-size:13px;color:#777}.bar{height:10px;background:#eee;border-radius:6px;overflow:hidden}.bar>div{height:100%;background:#9baaa1}label{display:block;margin:10px 0}input[type=range]{width:100%;padding:0}input[type=text]{max-width:100%}.hidden{display:none}#preview{padding:38px 15px;text-align:center;min-height:200px}#preview strong{font-size:clamp(28px,7vw,60px);display:block}footer{margin-top:35px;font-size:12px;color:#777}@media(max-width:520px){.panel{padding:15px}}</style><header><small>HANA · LEARNING & CREATIVE PLATFORM</small><h1>Interactive Studio</h1><p class="muted">Explore · Learn · Create</p><a href="../">← HANA FOCUS</a></header><section class="panel"><div class="grid" id="menu"></div></section><main id="content" class="panel"></main><footer>概念教學原型。香氣數據為示意，非 IFRA 安全驗證或實際嗅覺測試。資料僅保留於目前頁面。</footer><script>
const modules=[["perfume","01 · Perfume Lab","虛擬調香實驗室","配方比例與 A/B 比較"],["music","02 · Music Room","古典音樂聆賞室","長號與音樂史"],["botanical","03 · Botanical Atlas","天然香材圖鑑","植物、萃取與香氣"],["brand","04 · Brand Studio","品牌視覺實驗室","風格、字體與色彩"]];
const materials=[["佛手柑","前調",1,5,0,0],["檸檬","前調",0,5,0,0],["玫瑰","中調",5,0,1,0],["茉莉","中調",5,0,0,0],["檀香","後調",0,0,4,5],["岩蘭草","後調",0,0,1,5]];
const recipes={A:[20,10,25,15,15,15],B:[10,20,15,15,20,20]};let active="A",currentModule="perfume",era=0,quiz=0,choice=-1,style=0,palette=0;
const eras=[["文藝復興","Sackbut（薩克布號）與聲樂及宗教合奏密切相關。"],["巴洛克","長號在部分宗教作品中支援合唱聲部。"],["古典","貝多芬第五號交響曲第四樂章加入三支長號。"],["浪漫","長號成為管弦樂中重要的戲劇性銅管聲部。"],["現代","長號廣泛參與獨奏、室內樂與跨風格作品。"]];
const botanicals=[["玫瑰","Rosa × damascena","花瓣","保加利亞、土耳其","水蒸氣蒸餾或溶劑萃取","花香、蜜甜、微辛","花香調核心"],["鳶尾","Iris pallida","地下根莖","義大利、法國","根莖乾燥熟成後加工","粉質、木質、紫羅蘭感","粉香與木質花香"],["檀香","Santalum album","心材","印度、澳洲","心材水蒸氣蒸餾","溫暖、奶油木質","後調與基底"],["佛手柑","Citrus × bergamia","果皮","義大利卡拉布里亞","果皮冷壓","清新、柑橘、微苦","古龍水及柑橘前調"],["岩蘭草","Chrysopogon zizanioides","根部","海地、印尼、印度","根部水蒸氣蒸餾","土壤、木質、煙燻","木質及馥奇基底"]];
const palettes=[["#f5f2eb","#252525","#b8ad9c"],["#f0e7dd","#953f37","#c4a18e"],["#e8e9df","#53675c","#a9b2a3"],["#eee8dc","#283d54","#bfa07c"]];
function el(id){return document.getElementById(id)}function show(id){currentModule=id;el("menu").innerHTML=modules.map(m=>'<div class="tile" onclick="show(\''+m[0]+'\')"><small>'+m[1]+'</small><strong>'+m[2]+'</strong><p>'+m[3]+'</p></div>').join("");render()}
function render(){if(currentModule==="perfume")return perfume();if(currentModule==="music")return music();if(currentModule==="botanical")return botanical();brand()}
function perfume(){let vals=recipes[active],total=vals.reduce((a,b)=>a+b,0);el("content").innerHTML='<h2>Perfume Lab · 配方工作台</h2><div class="row">'+["A","B"].map(k=>'<button class="'+(k===active?'active':'')+'" onclick="active=\''+k+'\';render()">配方 '+k+'</button>').join("")+'</div><p>總比例：<strong>'+total+'%</strong> · '+(total===100?'✓ 通過':'未通過，請調整')+'</p><div class="bar"><div style="width:'+Math.min(100,total)+'%"></div></div>'+materials.map((m,i)=>'<label>'+m[1]+' · '+m[0]+'　<strong>'+vals[i]+'%</strong><input type="range" min="0" max="100" value="'+vals[i]+'" oninput="recipes[active]['+i+']=+this.value;render()"></label>').join("")+'<button onclick="normalize()">自動換算為 100%</button><h3>A / B 香氣輪廓比較</h3><div id="profiles"></div><button onclick="navigator.clipboard.writeText(JSON.stringify(recipes,null,2))">複製配方資料</button>';el("profiles").innerHTML=["A","B"].map(k=>{let t=recipes[k].reduce((a,b)=>a+b,0)||1;return '<h4>配方 '+k+'</h4>'+["花香","柑橘","甜潤","木質"].map((n,j)=>{let v=Math.round(recipes[k].reduce((s,p,i)=>s+p*materials[i][j+2],0)/t*20);return '<small>'+n+' '+v+'/100</small><div class="bar"><div style="width:'+v+'%"></div></div>'}).join("")}).join("")}
function normalize(){let v=recipes[active],t=v.reduce((a,b)=>a+b,0);if(!t)return;let r=v.map(x=>Math.floor(x*100/t));let left=100-r.reduce((a,b)=>a+b,0);for(let i=0;i<left;i++)r[i%r.length]++;recipes[active]=r;render()}
function music(){el("content").innerHTML='<h2>Music Room · 長號聆賞室</h2><p>音樂史時間軸</p><nav>'+eras.map((e,i)=>'<button class="'+(era===i?'active':'')+'" onclick="era='+i+';render()">'+e[0]+'</button>').join("")+'</nav><div class="panel"><h3>'+eras[era][0]+'</h3><p>'+eras[era][1]+'</p></div><h3>管弦樂編制</h3><p>弦樂 · 木管 · 銅管（法國號、小號、長號、大號） · 打擊。常見長號組為兩支次中音長號與一支低音長號。</p><h3>知識小測驗</h3><p>貝多芬第五號交響曲在哪個樂章加入長號？</p>'+["第一","第二","第三","第四"].map((x,i)=>'<button class="'+(choice===i?'active':'')+'" onclick="choice='+i+';render()">'+x+'樂章</button>').join(" ")+(choice<0?'':'<p>'+(choice===3?'✓ 正確！':'正確答案是第四樂章。')+'</p>')+'<p><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=Beethoven+Symphony+5+fourth+movement+trombone">尋找貝多芬第五號交響曲演奏影片 ↗</a></p>'}
function botanical(){let idx=window.botIndex||0,b=botanicals[idx];el("content").innerHTML='<h2>Botanical Atlas · 天然香材</h2><nav>'+botanicals.map((x,i)=>'<button class="'+(idx===i?'active':'')+'" onclick="window.botIndex='+i+';render()">'+x[0]+'</button>').join("")+'</nav><div class="panel"><h3>'+b[0]+'</h3><i>'+b[1]+'</i><p>萃取部位：'+b[2]+'</p><p>主要產地：'+b[3]+'</p><p>萃取方式：'+b[4]+'</p><p>氣味：'+b[5]+'</p><p>調香應用：'+b[6]+'</p></div><p class="muted">本版為文字圖鑑；植物實拍照片待來源核實後加入。</p>'}
function brand(){let p=palettes[palette],names=["極簡","復古","藝術","現代街頭"],fonts=["Georgia,serif","Times New Roman,serif","Georgia,serif","Arial,sans-serif"];el("content").innerHTML='<h2>Brand Studio · 品牌視覺</h2><label>品牌名稱 <input id="brandName" value="'+(window.brandName||"HANA")+'" oninput="window.brandName=this.value;updatePreview()"></label><nav>'+names.map((n,i)=>'<button class="'+(style===i?'active':'')+'" onclick="style='+i+';render()">'+n+'</button>').join("")+'</nav><p>切換配色</p><nav>'+palettes.map((a,i)=>'<button onclick="palette='+i+';render()" style="background:'+a[1]+';color:white">'+(i+1)+'</button>').join("")+'</nav><div id="preview" style="background:'+p[0]+';color:'+p[1]+';font-family:'+fonts[style]+'"><small>OLFACTORY · CREATIVE STUDIO</small><strong id="previewName"></strong><p>SCENT · ART · IDENTITY</p></div><p>色票：'+p.join(" · ")+'</p><button onclick="navigator.clipboard.writeText(\'品牌：\'+(window.brandName||\'HANA\')+\'｜風格：'+names[style]+'｜色票：'+p.join(",")+'\')">複製 Moodboard 規格</button>';updatePreview()}
function updatePreview(){el("previewName").textContent=window.brandName||"HANA"}show("perfume");
</script></html>
