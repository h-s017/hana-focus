name: Notion Read-Only Review
on:
  workflow_dispatch:
    inputs:
      hana_review_authorized:
        description: HANA authorizes this read-only run (not G1-G5 approval)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  notion-review:
    if: github.event_name == 'workflow_dispatch' && inputs.hana_review_authorized == true
    environment: notion-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate read-only review or safe setup failure
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: python agents/notion_readonly.py
      - name: Preserve safe result (including missing-token guidance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-readonly-review
          path: agent_output/notion-connection-review.md
          if-no-files-found: error
          retention-days: 1
