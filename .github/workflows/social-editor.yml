name: Social Editor — daily editorial and Canva source package
on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      lesson_date:
        description: Optional Asia/Taipei date YYYY-MM-DD for a safe backfill
        required: false
        type: string
  push:
    branches: [hana-focus-preview]
    paths:
      - 'ops/social-editor-trigger.txt'
permissions:
  contents: write
concurrency:
  group: hana-social-editor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test editorial content package (no account credentials)
        run: |
          node tests/office/social-daily.test.mjs
          node tests/office/three-agent-status.test.mjs
      - name: Generate 6-page editable-copy source and IG caption
        env:
          LESSON_DATE: ${{ inputs.lesson_date }}
        run: node scripts/social-editor.mjs
      - name: Install pinned editable PowerPoint builder
        run: python -m pip install --disable-pip-version-check --no-input python-pptx==1.0.2
      - name: Build Canva Connect-compatible PowerPoint source
        env:
          LESSON_DATE: ${{ inputs.lesson_date }}
        run: python scripts/social-canva-pptx.py
      - name: Verify six fully editable pages
        env:
          LESSON_DATE: ${{ inputs.lesson_date }}
        run: |
          python - <<'PYTEST'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os, pathlib
          from pptx import Presentation
          date=os.environ.get('LESSON_DATE') or datetime.now(ZoneInfo('Asia/Taipei')).strftime('%Y-%m-%d')
          file=pathlib.Path('content/instagram')/date/'canva-import.pptx'
          if not file.exists():
              print('SKIP: no validated content, so no PowerPoint generated')
          else:
              prs=Presentation(file)
              assert len(prs.slides)==6
              assert prs.slide_width*5==prs.slide_height*4
              assert all(len([sh for sh in page.shapes if sh.has_text_frame and sh.text.strip()])>=4 for page in prs.slides)
              print('PASS: 6 editable Canva source slides at 4:5')
          PYTEST
      - name: Commit daily source package (NOT Canva or Instagram publication)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/instagram
          git diff --cached --quiet || (git commit -m "Prepare HANA micro-lesson daily Canva copy package" && git push)
