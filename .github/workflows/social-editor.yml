name: Social Editor daily draft and dashboard status
on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:
  push:
    branches: [hana-focus-preview]
    paths:
      - 'ops/social-editor-trigger.txt'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare daily draft, music and live dashboard status
        run: node scripts/social-editor.mjs
      - name: Commit draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/instagram
          git diff --cached --quiet || (git commit -m "Prepare social editor daily draft" && git push)
