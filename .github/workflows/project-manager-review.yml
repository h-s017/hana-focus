name: Project Manager Review
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project ID
        required: true
        default: wenqingji
        type: choice
        options:
          - wenqingji
          - qipao-pop-up
  push:
    branches: [hana-focus-preview]
    paths:
      - 'agent_data/**'
      - 'agents/project_manager.py'
      - '.github/workflows/project-manager-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate review report
        env:
          REQUESTED_PROJECT: ${{ github.event.inputs.project || 'all' }}
        run: |
          if [ "$REQUESTED_PROJECT" = "all" ]; then
            python agents/project_manager.py --project wenqingji
            python agents/project_manager.py --project qipao-pop-up
          else
            python agents/project_manager.py --project "$REQUESTED_PROJECT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: project-manager-review
          path: agent_output/*-review.md
          retention-days: 30
