name: Project Manager Review
on:
  workflow_dispatch:
    inputs:
      project:
        description: Only wenqingji is supported
        required: true
        default: wenqingji
        type: choice
        options: [wenqingji]
  push:
    branches: [hana-focus-preview, codex/issue-4-notion-readonly]
    paths: ['agents/**', 'agent_data/**', 'tests/**', '.github/workflows/project-manager-review.yml', '.github/workflows/notion-readonly-review.yml']
  pull_request:
    paths: ['agents/**', 'agent_data/**', 'tests/**', '.github/workflows/project-manager-review.yml', '.github/workflows/notion-readonly-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML validator
        run: python -m pip install PyYAML==6.0.3
      - name: Offline tests (no secrets or external API)
        run: python -m unittest discover -s tests -v
      - name: Generate GitHub snapshot review
        run: python agents/project_manager.py --project wenqingji
      - uses: actions/upload-artifact@v4
        with:
          name: project-manager-review
          path: agent_output/wenqingji-review.md
          if-no-files-found: error
          retention-days: 7
