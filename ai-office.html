<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HANA AI OFFICE</title><style>body{font:15px system-ui,"Noto Sans TC",sans-serif;max-width:900px;margin:auto;padding:28px 16px;background:#f8f8f5;color:#292d2a}h1{font:32px Georgia,serif}section,article{background:white;border:1px solid #ddd;border-radius:12px;padding:18px;margin:15px 0}input,textarea,select{display:block;box-sizing:border-box;width:100%;margin:8px 0 14px;padding:10px;border:1px solid #bbb;border-radius:7px;font:inherit}button{border:0;background:#334b40;color:white;border-radius:7px;padding:10px 14px;cursor:pointer;margin:4px}button:disabled{opacity:.5}small,.muted{color:#666}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f5f2;padding:12px;border-radius:7px}a{color:#344f43}</style></head><body><a href="./workspace.html">← HANA WORKSPACE</a><h1>HANA AI OFFICE</h1><p class="muted">統一雲端任務與審核中心｜Asia/Taipei。AI 草稿必須經人工審核，且不會自動對外發布。</p><section><h2>登入</h2><label>電子郵件<input id="email" type="email" autocomplete="email" placeholder="你的登入信箱"></label><button id="login">寄送登入連結</button><button id="logout">登出</button><p id="session" class="muted">正在確認登入狀態…</p></section><section id="private" hidden><h2>新增任務</h2><label>專案<input id="project" value="文慶雞"></label><label>Agent<select id="role"><option>Brand Strategist</option><option>Creative Producer</option><option>Project Manager</option></select></label><label>任務標題<input id="title" placeholder="例如：品牌定位策略"></label><label>需求與背景<textarea id="brief" rows="5"></textarea></label><button id="add">儲存雲端任務</button><button id="refresh">重新整理</button><p id="notice" aria-live="polite"></p><h2>任務與審核</h2><div id="tasks"></div></section><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2.57.0";const base="https://ihmvziqisputjnjkuhvm.supabase.co",key="sb_publishable_xipXAHCwziguVpbr3DEN-w_AI6Cap3f",db=createClient(base,key),$=id=>document.getElementById(id);let current=null,loginPending=false,loginCooldownUntil=0;const msg=s=>$("notice").textContent=s;const escape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function sync(){const{data:{session}}=await db.auth.getSession();current=session;$("private").hidden=!session;$("session").textContent=session?"已登入："+session.user.email:"未登入。請使用電子郵件登入連結。";if(session)await refresh()}db.auth.onAuthStateChange(()=>setTimeout(sync,0));$("login").onclick=async()=>{const email=$("email").value.trim(),button=$("login");if(!email){$("session").textContent="請先輸入電子郵件。";return}if(loginPending||Date.now()<loginCooldownUntil){$("session").textContent="請勿重複寄送。若遇郵件額度限制，請稍後再試或聯絡管理者設定 SMTP。";return}loginPending=true;button.disabled=true;$("session").textContent="正在要求登入連結…";try{const{error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});loginCooldownUntil=Date.now()+(error?.status===429?3600000:120000);$("session").textContent=error?(error.status===429?"寄信頻率或額度已達限制，請勿重複點擊；需檢查 Supabase SMTP 設定。":error.message):"寄送請求已受理。請查看最新郵件；連結只能使用一次。"}catch(e){loginCooldownUntil=Date.now()+120000;$("session").textContent="登入請求失敗："+String(e)}finally{loginPending=false;button.disabled=false}};$("logout").onclick=async()=>{await db.auth.signOut();await sync()};$("add").onclick=async()=>{if(!current)return;const data={owner_id:current.user.id,project:$("project").value.trim(),role:$("role").value,title:$("title").value.trim(),brief:$("brief").value.trim()};if(!data.project||!data.title||!data.brief){msg("請填寫所有欄位");return}const{error}=await db.from("hana_tasks").insert(data);msg(error?error.message:"任務已儲存");if(!error)await refresh()};$("refresh").onclick=refresh;async function call(task_id,action,decision){if(!current)return;msg("執行中…");const{data,error}=await db.functions.invoke("hana-agent",{body:{task_id,action,decision}});msg(error?error.message:data?.error||"已完成");await refresh()}async function refresh(){const{data,error}=await db.from("hana_tasks").select("*").order("created_at",{ascending:false}).limit(100);if(error){msg(error.message);return}const box=$("tasks");box.replaceChildren();for(const t of data){const el=document.createElement("article");el.innerHTML='<h3>'+escape(t.title)+'</h3><p>'+escape(t.project)+'｜'+escape(t.role)+'｜<b>'+escape(t.status)+'</b></p><small>'+escape(new Date(t.created_at).toLocaleString("zh-TW",{timeZone:"Asia/Taipei"}))+'</small><p>'+escape(t.brief)+'</p>'+(t.result?'<pre>'+escape(t.result)+'</pre>':'');if(["queued","failed"].includes(t.status)&&t.role!=="Project Manager"){const b=document.createElement("button");b.textContent="執行 AI 生成";b.onclick=()=>call(t.id,"generate");el.append(b)}if(t.status==="review"){for(const [label,decision] of [["核准","approved"],["退回","rejected"]]){const b=document.createElement("button");b.textContent=label;b.onclick=()=>call(t.id,"review",decision);el.append(b)}}const {data:reviews}=await db.from("hana_reviews").select("decision,note,created_at").eq("task_id",t.id).order("created_at",{ascending:false});if(reviews?.length){const p=document.createElement("p");p.className="muted";p.textContent="審核紀錄："+reviews.map(r=>r.decision+" "+new Date(r.created_at).toLocaleString("zh-TW",{timeZone:"Asia/Taipei"})).join("；");el.append(p)}box.append(el)}}sync();</script></body></html>
